name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is tested by deploy.yml before it deploys
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voice
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/voice
      # No REDIS_URL, GROQ_API_KEY or embedding model needed: external services are mocked in the tests.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run   # fails if a migration was forgotten
      - run: python manage.py test tests -v 2

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
